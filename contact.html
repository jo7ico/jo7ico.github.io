    <h1>Get in Touch.<span class="cursor">_</span></h1>
    <p class="margins">
      For questions, project inquiries, requests, suggestions, and feedback,
      please use the form below.
    </p>

    <div class="ipad-container">
      <img
        id="ipadA16Vertical"
        src="images/ipadVertical-pink.png"
        class="ipad-frame"
      />

      <div class="ipad-screen">
        <form action="sendmail.php" method="POST" style="border: none">
          <h2>Contact</h2>
          <label for="title" class="darkslateblue">Title:</label>
          <input type="text" name="title" required /><br /><br />

          <label for="name" class="rosybrown">Name:</label>
          <input type="text" name="name" required /><br /><br />

          <label for="email" class="gold">Your email:</label>
          <input type="email" name="email" required /><br /><br />

          <label for="message" class="slategray">Message:</label><br />
          <textarea name="message" rows="5" required></textarea><br /><br />

          <button type="submit">Send</button>
        </form>
      </div>
    </div>
